name: Android release → Google Play (internal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Faixa do Google Play'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Variaveis EXPO_PUBLIC_* sao embutidas no bundle JS durante o build.
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_PATH_PREFIX: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_PATH_PREFIX }}

jobs:
  build-and-publish:
    name: Build AAB e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuracao
        run: |
          missing=0
          for v in EXPO_PUBLIC_API_URL; do
            if [ -z "${!v}" ]; then echo "::error::Variable $v nao definida (Settings > Variables)"; missing=1; fi
          done
          [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ] || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON ausente"; missing=1; }
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente"; missing=1; }
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD ausente"; missing=1; }
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || { echo "::error::Secret ANDROID_KEY_ALIAS ausente"; missing=1; }
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || { echo "::error::Secret ANDROID_KEY_PASSWORD ausente"; missing=1; }
          exit $missing

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Definir versao (tag → version, run_number → versionCode)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(jq -r '.expo.version' app.json)
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          jq --arg v "$VERSION" --argjson c "$VERSION_CODE" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Versao $VERSION (versionCode $VERSION_CODE)"

      - name: Expo prebuild (android)
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Configurar keystore de upload
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          mkdir -p ~/.gradle
          {
            echo "LISTAFACIL_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks"
            echo "LISTAFACIL_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "LISTAFACIL_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "LISTAFACIL_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> ~/.gradle/gradle.properties

      - name: Gradle bundleRelease
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Guardar AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: listafacil-${{ steps.version.outputs.version }}-${{ steps.version.outputs.version_code }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publicar no Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.listafacil.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          releaseName: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.version_code }})
          changesNotSentForReview: false
